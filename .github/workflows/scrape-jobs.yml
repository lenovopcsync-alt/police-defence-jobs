name: Scrape Jobs
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests beautifulsoup4 lxml -q
      - run: |
          python3 -c "
import requests, json, sys
from bs4 import BeautifulSoup
from datetime import datetime
URL='https://www.freejobalert.com/police-defence-jobs/'
H={'User-Agent':'Mozilla/5.0'}
r=requests.get(URL,headers=H,timeout=30)
soup=__import__('bs4').BeautifulSoup(r.text,'lxml')
jobs=[]
for t in soup.find_all('table'):
  for row in t.find_all('tr'):
    c=row.find_all(['td','th'])
    if len(c)<5: continue
    txt=[x.get_text(strip=True) for x in c]
    if any(h in ' '.join(txt).lower() for h in ['post date','recruitment board','exam / post name','qualification','advt no','last date']): continue
    if len(txt)>=6:
      pd,o,ti,q,a,l=txt[:6]
      link=''; x=row.find('a',href=True)
      if x: link=x['href']; link=link if link.startswith('http') else 'https://www.freejobalert.com'+link
      ct=any(k in (ti+' '+o).lower() for k in ['upsc','ssc','rrb','ibps','rbi','sbi','ntpc','bhel','indian army','indian navy','indian air force','bsf','crpf','cisf','itbp','ssb','assam rifles','capf','coast guard','territorial army','ordnance factory','naval dockyard','drde','dmrl','drdo','sainik school'])
      jobs.append({'title':ti,'organization':o,'qualification':q,'advt_no':a,'last_date':l,'post_date':pd,'link':link,'type':'Central' if ct else 'State','scraped_at':__import__('datetime').datetime.utcnow().isoformat()+'Z'})
try:
  jobs=scrape()
  seen=set(); u=[]
  for j in jobs:
    k=j.get('link') or j['title']+j['organization']
    if k not in seen: seen.add(k); u.append(j)
  with open('police_defence_jobs.json','w') as f: json.dump({'source':'FreeJobAlert','url':URL,'scraped_at':__import__('datetime').datetime.utcnow().isoformat()+'Z','count':len(u),'jobs':u},f,indent=2)
  print('Saved',len(u),'jobs')
except Exception as e: print(e); sys.exit(1)
"
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add police_defence_jobs.json
          git diff --staged --quiet || git commit -m "update jobs" && git push
